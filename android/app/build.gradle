plugins {
    id 'com.android.application'
}

android {
    namespace 'com.minhatv.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.minhatv.app'
        minSdk 21
        targetSdk 34
        // o GitHub passa o número da compilação, assim cada versão nova pode atualizar a anterior
        versionCode (project.findProperty('vCode') ?: '1').toInteger()
        versionName '1.0'
    }

    // chave fixa: sem ela, cada compilação teria uma assinatura diferente e a TV não deixaria atualizar o app
    signingConfigs {
        minhatv {
            storeFile file('minhatv.keystore')
            storePassword 'minhatv123'
            keyAlias 'minhatv'
            keyPassword 'minhatv123'
        }
    }

    buildTypes {
        debug   { signingConfig signingConfigs.minhatv }
        release { signingConfig signingConfigs.minhatv; minifyEnabled false }
    }
}
